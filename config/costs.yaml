# Trading costs. Percentages are in percent (0.025 means 0.025%).
# Statutory rates as of Oct 2026; re-verify before going live.

statutory:
  transaction_charge_pct: 0.00297   # NSE, both legs
  sebi_fee_per_crore: 10            # rupees per crore of turnover, both legs
  gst_pct: 18                       # on brokerage + transaction + SEBI fee (+ DP charge)
  intraday:
    stt_sell_pct: 0.025
    stamp_buy_pct: 0.003
  delivery:
    stt_buy_pct: 0.1
    stt_sell_pct: 0.1
    stamp_buy_pct: 0.015
  # Units of equity-oriented ETFs, delivery (CNC) only. Transaction charge, SEBI fee and
  # GST as for equity; brokerage and DP charge from the active preset's delivery entry.
  etf_delivery:
    # STT: NSE circular NSE/FATAX/73524 (31 Mar 2026), rates from 1 Apr 2026: row 2A,
    # sale of a unit of an equity oriented fund on delivery 0.001%, seller (no change).
    # No row for buying such a unit, so nil on buy.
    stt_buy_pct: 0
    stt_sell_pct: 0.001
    # Stamp: NSE's stamp duty table, "transfer of security other than debenture on
    # delivery basis" 0.015%, buyer. Indian Stamp Act s.2(23A)(i) takes "securities"
    # from SCRA s.2(h), which includes units issued under any mutual fund scheme.
    stamp_buy_pct: 0.015

brokerage:
  # Brokerage is charged per executed order (each leg), separately for
  # intraday (MIS) and delivery (CNC).
  # model: zero | flat_or_pct (lower of flat_rupees and pct of order value) | flat
  # dp_charge_per_scrip_rupees: per scrip on each delivery sell day, BEFORE GST;
  # costs.py adds GST on top.
  active: shoonya
  presets:
    zero:  # reference tier: no broker charges, statutory only
      intraday:
        model: zero
      delivery:
        model: zero
      dp_charge_per_scrip_rupees: 0
    shoonya:
      intraday:
        model: flat_or_pct
        flat_rupees: 5
        pct: 0.03
      delivery:
        model: zero
      dp_charge_per_scrip_rupees: 9
    dhan:
      intraday:
        model: flat_or_pct
        flat_rupees: 20
        pct: 0.03
      delivery:
        model: zero
      dp_charge_per_scrip_rupees: 12.50

# Slippage tiers, basis points per side, applied to fill prices by the simulator.
# `none` is for the statutory-only reference tier (with the `zero` preset); any run with
# zero slippage is logged as reference_tier: true.
slippage_bps_per_side:
  none: 0
  base: 3
  stress1: 6
  stress2: 10
# The same tiers for equity-ETF units (instrument ETF; strategy 4, owner's values,
# research/strategy4_plan.md section 5). Used instead of the table above for ETF runs.
etf_slippage_bps_per_side:
  none: 0
  base: 10
  stress1: 20
  stress2: 30

# IPO applications (manual UPI, simulated in research only; research/ipo_strategy_plan.md
# section 6). The listing-day sale is an ordinary delivery sell (the delivery rates above,
# the active preset's delivery brokerage and DP charge).
ipo:
  # Allotment: no brokerage and no STT. Stamp duty on an issue of securities is collected
  # from the issuer (from the offeror for an offer for sale): Indian Stamp (Collection of
  # Stamp-Duty through Stock Exchanges, Clearing Corporations and Depositories) Rules,
  # 2019, rule 6(1) and 6(4), G.S.R. 901(E) of 10 Dec 2019 (Gazette of India). Taken as in
  # force for allotments from stamp_rule_from (the deferral to 1 Jul 2020 is from secondary
  # sources); before that, the owner's default rate on the allotment value.
  stamp_rule_from: 2020-07-01
  allotment_stamp_pct: 0
  allotment_stamp_pct_before_rule: 0.015
# Slippage on the listing-day open sale, percent of the price (owner's tiers). `none` is
# the reference tier.
ipo_listing_slippage_pct:
  none: 0
  base: 0.25
  stress1: 0.5
  stress2: 1.0
